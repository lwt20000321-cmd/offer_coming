[project]
name = "offer-coming"
version = "0.1.0"
description = "面试陪伴 Agent"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["backend/src", "backend/tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pycore.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
