      border-radius: 16px;
      padding: 16px;
      margin: 0 0 14px;
      overflow-wrap: anywhere;

    summary { cursor: pointer; color: var(--accent); }

    ol.flow li { margin: 0 0 8px; overflow-wrap: anywhere; word-break: break-word; }
    .hint, .lead, .meta { overflow-wrap: anywhere; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .copy, .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 13px;
    }
    .pathbox {
      width: 100%;
      margin-top: 8px;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #sample-out {

      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 4.5em;
    }
    textarea {

      min-height: 120px;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;

        z-index: 2;

      h1 { font-size: 1.15rem; }
      .lead, .meta, .hint { overflow-wrap: anywhere; }

  <script>
    const STATUS_CLASS = {
      "源码已核对": "",
      "来源已变化待复核": "warn",
      "未找到实现": "bad",
      "来源缺失": "bad",
      "解析失败": "bad",
      "仅设计": "design"
    };

    function $(id) { return document.getElementById(id); }
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function statusBadge(status) {
      const cls = STATUS_CLASS[status] || "warn";
      return `<span class="status ${cls}">${escapeHtml(status || "未记录")}</span>`;
    }
    function byId(list, id) {
      return (list || []).find((item) => item.id === id);
    }
    function setLive(text) { $("live").textContent = text; }

    function copyPath(path, fallbackHost) {
      const done = () => setLive("已复制路径：" + path);
      const fail = () => {
        fallbackHost.innerHTML = `<input class="pathbox" readonly value="${escapeHtml(path)}" />`;
        const input = fallbackHost.querySelector("input");
        input.focus();
        input.select();
        setLive("复制失败，请手选路径。");
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(path).then(done).catch(fail);
        return;
      }
      fail();
    }

    function sourceList(sources) {
      if (!sources || !sources.length) return "<p class='hint'>未记录来源。</p>";
      return sources.map((src, index) => {
        const hostId = `fb-${src.path}-${index}-${Math.random().toString(16).slice(2, 8)}`;
        return `<div class="row" style="margin-top:6px">
          <code>${escapeHtml(src.path)}</code>
          <span>${escapeHtml(src.symbol || "")}</span>
          <span class="hint">${escapeHtml(src.fingerprint || "")} · ${escapeHtml(src.checked_at || "")}</span>
          <button type="button" class="copy" data-path="${escapeHtml(src.path)}" data-fallback="${hostId}">复制路径</button>
        </div><div id="${hostId}"></div>`;
      }).join("");
    }

    function renderFlow(flow) {
      if (!flow || !flow.length) return "";
      return `<ol class="flow">${flow.map((step) => `<li>
        <strong>${escapeHtml(step.actor)}</strong>：${escapeHtml(step.action)}
        <div class="hint">数据：${escapeHtml(step.data)}</div>
        <div class="hint">分支：${escapeHtml(step.branch)}</div>
      </li>`).join("")}</ol>`;
    }

    function renderApi(api) {
      const req = (api.request || []).map((item) =>
        `<li>${escapeHtml(item.name)} · ${escapeHtml(item.in)} · ${escapeHtml(item.type)} · ${item.required ? "必填" : "可选"}</li>`
      ).join("");
      return `<div class="card" id="${escapeHtml(api.id)}">
        <h3>${escapeHtml(api.id)} ${escapeHtml(api.name)}</h3>
        <p><code>${escapeHtml(api.method)} ${escapeHtml(api.url)}</code></p>
        <p class="hint">鉴权：${escapeHtml(api.auth || "未记录")}</p>
        ${statusBadge(api.implementation_status)}
        <details>
          <summary>请求 / 响应字段</summary>
          <p>请求</p>
          <ul>${req || "<li>无 body</li>"}</ul>
          <p>成功：${escapeHtml(api.response && api.response.success)}</p>
          <p>失败：${escapeHtml(api.response && api.response.failure)}</p>
        </details>
        <details>
          <summary>来源</summary>
          ${sourceList(api.sources)}
        </details>
      </div>`;
    }

    function renderAlgorithm(alg) {
      const agent = alg.agent ? `<details open>
        <summary>Agent 循环（源码真实存在）</summary>
        <p>模型：${escapeHtml(alg.agent.model)}</p>
        <p>提示词：${escapeHtml(alg.agent.prompt)}</p>
        <p>工具：${escapeHtml((alg.agent.tools || []).join("、"))}</p>
        <p>观察：${escapeHtml(alg.agent.observation)}</p>
        <p>循环：${escapeHtml(alg.agent.loop)}</p>
        <p>停止：${escapeHtml(alg.agent.stop)}</p>
        <p>限制：${escapeHtml(alg.agent.limits)}</p>
        <p>结果：${escapeHtml(alg.agent.result)}</p>
      </details>` : "";
      return `<div class="card" id="${escapeHtml(alg.id)}">
        <h3>${escapeHtml(alg.subject)}</h3>
        ${statusBadge(alg.implementation_status)}
        <details>
          <summary>步骤、条件、异常</summary>
          <p>步骤</p>
          <ol>${(alg.steps || []).map((s) => `<li>${escapeHtml(s)}</li>`).join("")}</ol>
          <p>分支</p>
          <ul>${(alg.branches || []).map((s) => `<li>${escapeHtml(s)}</li>`).join("")}</ul>
          <p>结果选择：${escapeHtml(alg.selection || "")}</p>
          <p>失败：${escapeHtml(alg.failures || "")}</p>
        </details>
        ${agent}
        <details>
          <summary>来源</summary>
          ${sourceList(alg.sources)}
        </details>
      </div>`;
    }

    function renderModule(mod) {
      return `<div class="card" id="${escapeHtml(mod.id)}">
        <h3>${escapeHtml(mod.name)}</h3>
        <p>类型：${escapeHtml(mod.kind)}。${escapeHtml(mod.responsibility)}</p>
        <p class="hint">输入：${escapeHtml(mod.input)}；输出：${escapeHtml(mod.output)}</p>
        ${statusBadge(mod.implementation_status)}
        <details><summary>来源</summary>${sourceList(mod.sources)}</details>
      </div>`;
    }

    function renderParams(map, ids) {
      const items = (ids || []).map((id) => byId(map.parameters, id)).filter(Boolean);
      if (!items.length) return "";
      return `<details>
        <summary>参数（默认值位置 / 影响）</summary>
        <ul>${items.map((p) => `<li>
          <code>${escapeHtml(p.key)}</code> = ${escapeHtml(p.value)}
          <div class="hint">${escapeHtml(p.value_kind)} · ${escapeHtml(p.location)}</div>
          <div class="hint">${escapeHtml(p.impact)}</div>
        </li>`).join("")}</ul>
      </details>`;
    }

    function renderFeature(map, feature) {
      const apis = (feature.api_ids || []).map((id) => {
        const api = byId(map.apis, id);
        return api
          ? `<a href="#${escapeHtml(id)}">${escapeHtml(api.method)} ${escapeHtml(api.url)}</a>`
          : escapeHtml(id);
      });
      const algs = (feature.algorithm_ids || []).map((id) => byId(map.algorithms, id)).filter(Boolean);
      const mods = (feature.module_ids || []).map((id) => byId(map.modules, id)).filter(Boolean);
      const paramIds = algs.flatMap((alg) => alg.parameter_ids || []);
      return `<article class="card" id="${escapeHtml(feature.id)}">
        <h2>${escapeHtml(feature.name)}</h2>
        ${statusBadge(feature.implementation_status)}
        <p><strong>触发</strong>：${escapeHtml(feature.trigger)}</p>
        <p><strong>输入</strong>：${escapeHtml(feature.input)}</p>
        <p><strong>输出</strong>：${escapeHtml(feature.output)}</p>
        <p><strong>主流程</strong></p>
        ${renderFlow(feature.flow)}
        <p>接口：${apis.join(" · ") || "无"}</p>
        <details>
          <summary>接口字段与算法</summary>
          ${(feature.api_ids || []).map((id) => {
            const api = byId(map.apis, id);
            return api ? renderApi(api) : `<p class="hint">未找到接口 ${escapeHtml(id)}</p>`;
          }).join("")}
          ${algs.map(renderAlgorithm).join("")}
          ${mods.map(renderModule).join("")}
          ${renderParams(map, paramIds)}
        </details>
        <details>
          <summary>功能来源</summary>
          ${sourceList(feature.sources)}
        </details>
      </article>`;
    }

    function renderBoundaries(map) {
      const items = map.runtime_verification_boundaries || [];
      if (!items.length) return "";
      return `<div class="card">
        <h2>运行验证边界（本轮未用真实服务核对）</h2>
        <p class="hint">源码已静态核对实现存在；下列项不得写成已核对通过。</p>
        <ul>${items.map((item) => `<li>
          <strong>${escapeHtml(item.id)}</strong> ${escapeHtml(item.item)}
          <span class="status warn">${escapeHtml(item.status || "本轮未验")}</span>
          <div class="hint">${escapeHtml(item.note || "")}</div>
        </li>`).join("")}</ul>
      </div>`;
    }

    function renderPage(map, page) {
      const features = (page.feature_ids || []).map((id) => byId(map.features, id)).filter(Boolean);
      $("view-page").innerHTML = `
        <div class="card">
          <h2>${escapeHtml(page.name)}</h2>
          <p>路径 <code>${escapeHtml(page.route)}</code></p>
          <p>${escapeHtml(page.purpose)}</p>
          ${statusBadge("源码已核对")}
        </div>
        ${features.map((feature) => renderFeature(map, feature)).join("")}
        ${renderBoundaries(map)}
        ${(map.design_vs_source && map.design_vs_source.length) ? `<div class="card">
          <h2>设计与源码并列（不把设计冒充已实现）</h2>
          <ul>${map.design_vs_source.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
        </div>` : ""}
      `;
    }

    function renderRefresh(map) {
      $("view-refresh").innerHTML = `
        <div class="card">
          <h2>刷新与核对</h2>
          <p>${escapeHtml(map.refresh && map.refresh.rule)}</p>
          <p class="hint">结构化数据：${escapeHtml(map.refresh && map.refresh.map_path)}。本页打开静态 HTML，不请求业务接口，不占用 5175。</p>
          <div class="row">
            <button type="button" class="btn" id="btn-load-file">手选 project-map.json</button>
            <button type="button" class="btn" id="btn-apply-text">应用下方 JSON</button>
          </div>
          <p class="hint" id="file-fallback"></p>
          <textarea id="map-text" aria-label="地图 JSON"></textarea>
        </div>
        <div class="card">
          <h2>隔离样例</h2>
          <p>用内置样例验证刷新规则，不读真实业务数据。</p>
          <div class="row">
            <button type="button" class="btn" id="sample-change">源码变更 → 待复核</button>
            <button type="button" class="btn" id="sample-missing">来源缺失</button>
            <button type="button" class="btn" id="sample-parse">解析失败</button>
          </div>
          <div id="sample-out" role="status"></div>
        </div>
      `;
      $("map-text").value = JSON.stringify(map, null, 2);
      $("btn-apply-text").onclick = () => applyRaw($("map-text").value, "textarea");
      $("btn-load-file").onclick = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "application/json,.json";
        input.onchange = async () => {
          const file = input.files && input.files[0];
          if (!file) return;
          applyRaw(await file.text(), file.name);
        };
        input.click();
      };
      $("sample-change").onclick = runSampleChanged;
      $("sample-missing").onclick = runSampleMissing;
      $("sample-parse").onclick = runSampleParse;
    }

    function fingerprintChanged(item, incoming) {
      const sources = item.sources || [];
      let changed = false;
      for (const src of sources) {
        const next = incoming[src.path];
        if (!next) continue;
        if (next !== src.fingerprint) {
          src.previous_fingerprint = src.fingerprint;
          src.fingerprint = next;
          changed = true;
        }
      }
      if (changed) item.implementation_status = "来源已变化待复核";
      return item;
    }

    function runSampleChanged() {
      const sample = {
        id: "alg-sample",
        subject: "隔离：Key 探测算法",
        implementation_status: "源码已核对",
        sources: [{ path: "backend/src/services/llm_probe.py", symbol: "probe_llm_api_key", fingerprint: "3e6fa25003fae609", checked_at: "2026-09-14" }]
      };
      const after = fingerprintChanged(sample, { "backend/src/services/llm_probe.py": "deadbeefdeadbeef" });
      const ok = after.implementation_status === "来源已变化待复核";
      $("sample-out").textContent = [
        "样例：指纹由 3e6fa25003fae609 变为 deadbeefdeadbeef。",
        "刷新后状态：" + after.implementation_status,
        ok ? "通过：过期算法不再标「源码已核对」。" : "失败：状态仍为已核对。"
      ].join("\n");
      setLive(ok ? "隔离样例：源变更已标待复核" : "隔离样例失败");
    }

    function runSampleMissing() {
      const sample = { sources: [{ path: "backend/src/missing-file.py", missing: true }] };
      const src = sample.sources[0];
      const message = src.missing || !src.path
        ? "来源缺失：" + (src.path || "（空路径）") + "。降级为未找到实现，不能标已核对。"
        : "未触发缺失";
      $("sample-out").textContent = message;
      setLive("隔离样例：来源缺失已提示");
    }

    function runSampleParse() {
      const raw = "{not-json";
      try {
        JSON.parse(raw);
        $("sample-out").textContent = "未触发解析失败";
      } catch (err) {
        $("sample-out").textContent = "解析失败：地图 JSON 无法读取。" + String(err.message || err);
        setLive("隔离样例：解析失败已提示");
      }
    }

    function applyFingerprintRefresh(map, incoming) {
      const groups = ["features", "apis", "algorithms", "modules"];
      for (const key of groups) {
        for (const item of map[key] || []) {
          const hadChecked = item.implementation_status === "源码已核对";
          fingerprintChanged(item, incoming || {});
          if (hadChecked && item.implementation_status === "来源已变化待复核") {
            item.checked_at_stale = true;
          }
        }
      }
      return map;
    }

    let currentMap = null;
    let currentPageId = null;

    function bindCopies(root) {
      root.querySelectorAll("[data-path]").forEach((btn) => {
        btn.addEventListener("click", () => {
          copyPath(btn.getAttribute("data-path"), $(btn.getAttribute("data-fallback")));
        });
      });
    }

    function showPage(pageId) {
      currentPageId = pageId;
      $("view-refresh").classList.add("hide");
      $("view-page").classList.remove("hide");
      const page = byId(currentMap.pages, pageId) || currentMap.pages[0];
      renderPage(currentMap, page);
      bindCopies($("view-page"));
      document.querySelectorAll("#page-nav button").forEach((btn) => {
        btn.setAttribute("aria-current", btn.dataset.page === page.id ? "page" : "false");
      });
      document.querySelectorAll("#util-nav button").forEach((btn) => btn.setAttribute("aria-current", "false"));
      try { history.replaceState(null, "", "#" + page.id); } catch (err) { /* file:// */ }
    }

    function showRefresh() {
      $("view-page").classList.add("hide");
      $("view-refresh").classList.remove("hide");
      renderRefresh(currentMap);
      document.querySelectorAll("#page-nav button").forEach((btn) => btn.setAttribute("aria-current", "false"));
      document.querySelector("#util-nav button").setAttribute("aria-current", "page");
      try { history.replaceState(null, "", "#refresh"); } catch (err) { /* file:// */ }
    }

    function mount(map) {
      currentMap = map;
      $("site-title").textContent = map.project.name;
      $("delivery-history").textContent = map.project.previous_delivery || "";
      $("checked-at").textContent = "核对日期 " + (map.project.checked_at || "") + " · " + (map.project.git_revision || "");
      const bounds = (map.runtime_verification_boundaries || []).map((item) => item.id + " " + (item.status || "本轮未验"));
      $("runtime-bound").textContent = bounds.length
        ? "运行验证边界：" + bounds.join("；")
        : "";
      const nav = $("page-nav");
      nav.innerHTML = (map.pages || []).map((page) =>
        `<button type="button" data-page="${escapeHtml(page.id)}">${escapeHtml(page.name)}</button>`
      ).join("");
      nav.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => showPage(btn.dataset.page));
      });
      document.querySelector("#util-nav button").onclick = showRefresh;
      const hash = (location.hash || "").replace("#", "");
      if (hash === "refresh") showRefresh();
      else showPage(hash && byId(map.pages, hash) ? hash : map.pages[0].id);
    }

    function applyRaw(raw, label) {
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.pages) || !parsed.pages.length) {
          throw new Error("缺少 pages");
        }
        mount(parsed);
        setLive("已载入地图：" + label);
      } catch (err) {
        setLive("解析失败：" + label);
        const box = $("sample-out");
        if (box) box.textContent = "解析失败：" + String(err.message || err);
        if (!window.__selftest) {
          alert("解析失败：" + String(err.message || err));
        }
      }
    }

    function forbiddenBoardWords(text) {
      return ["项目概况", "启动指南", "验收看板", "决策看板", "任务看板", "六区管理"].filter((word) => text.includes(word));
    }

    function coverage(text, need, label) {
      const missing = need.filter((word) => !text.includes(word));
      return missing.length ? "FAIL " + label + " " + missing.join("/") : "PASS " + label;
    }

    function runSelftest() {
      const report = [];
      const pageIds = (currentMap.pages || []).map((p) => p.id);
      report.push("pages=" + pageIds.join(","));
      const fourPages = ["page-welcome", "page-chat", "page-apps", "page-knowledge"].every((id) => pageIds.includes(id));
      report.push(fourPages ? "PASS four pages" : "FAIL four pages " + pageIds.join(","));
      showPage("page-welcome");
      const welcomeText = document.body.innerText;
      const welcomeOk = welcomeText.includes("首次邮箱") && welcomeText.includes("POST /api/candidates") && welcomeText.includes("百炼") && welcomeText.includes("llm_api_key");
      report.push(welcomeOk ? "PASS welcome features" : "FAIL welcome features");
      document.querySelectorAll("#view-page details summary").forEach((el) => el.click());
      showPage("page-chat");
      document.querySelectorAll("#view-page details summary").forEach((el) => el.click());
      report.push(coverage(document.body.innerText, ["虚拟头像", "我的简历", "我的key", "退出", "记岗位", "三题", "催促", "辅导", "邮件失败", "kb_ask", "面经"], "chat coverage"));
      report.push(coverage(document.body.innerText, ["API-016", "API-017", "API-018", "D-007-C", "D-008-B", "D-009-B"], "key-avatar ids"));
      const api016 = document.querySelector("a[href='#api-016']");
      const api017 = document.querySelector("a[href='#api-017']");
      const api018 = document.querySelector("a[href='#api-018']");
      report.push(api016 && api017 && api018 ? "PASS api-016/017/018 links" : "FAIL api-016/017/018 links");
      showPage("page-apps");
      report.push(coverage(document.body.innerText, ["加一行", "已挂", "D-006-A", "PATCH /api/applications", "knowledge_review_pending", "虚拟头像"], "apps coverage"));
      showPage("page-knowledge");
      report.push(coverage(document.body.innerText, ["我的面经", "看正文", "GET /api/knowledge-items", "手删", "虚拟头像"], "kb coverage"));
      const overflowX = document.documentElement.scrollWidth > window.innerWidth + 1;
      report.push(overflowX ? "FAIL overflow-x" : "PASS no overflow-x");
      const clipped = [];
      const pageBox = $("view-page");
      pageBox.querySelectorAll("p, h2, li, .hint, .lead").forEach((el) => {
        const box = el.closest(".card") || pageBox;
        if (el.getBoundingClientRect().right > box.getBoundingClientRect().right + 2) {
          clipped.push((el.textContent || "").trim().slice(0, 24));
        }
      });
      report.push(clipped.length ? "FAIL clipped " + clipped.slice(0, 3).join("|") : "PASS no clipped text");
      showRefresh();
      runSampleChanged();
      const changeOk = $("sample-out").textContent.includes("待复核") && !$("sample-out").textContent.includes("失败：状态仍为已核对");
      report.push(changeOk ? "PASS sample-change" : "FAIL sample-change");
      runSampleMissing();
      report.push($("sample-out").textContent.includes("来源缺失") ? "PASS sample-missing" : "FAIL sample-missing");
      runSampleParse();
      report.push($("sample-out").textContent.includes("解析失败") ? "PASS sample-parse" : "FAIL sample-parse");
      applyRaw("{not-json", "selftest");
      report.push(($("live").textContent || "").includes("解析失败") ? "PASS apply-parse" : "FAIL apply-parse");
      const banned = forbiddenBoardWords(document.body.innerText);
      report.push(banned.length ? "FAIL board-words " + banned.join("/") : "PASS no old board");
      const mapText = JSON.stringify(currentMap);
      const fiveModels = ["llm_orchestrator_model", "llm_nudge_model", "llm_interview_model", "llm_knowledge_model", "llm_counseling_model"];
      report.push(coverage(mapText, fiveModels, "five models"));
      report.push(coverage(mapText, ["api-009", "api-010", "api-011", "api-012", "api-013", "api-014", "api-016", "api-017", "api-018", "ext-004", "enable_search"], "write-kb apis"));
      const xhsFake = ["小红书爬虫已实现", "已爬到小红书", "已接入小红书"].filter((word) => mapText.includes(word) || document.body.innerText.includes(word));
      report.push(xhsFake.length ? "FAIL xhs crawler claimed " + xhsFake.join("/") : "PASS no xhs crawler");
      report.push(mapText.includes("不是小红书爬虫") ? "PASS xhs not crawler" : "FAIL xhs not crawler");
      const operatorAsTraffic = ["运营 Key 作为用户流量", "用运营 llm_api_key 代付"].filter((word) => mapText.includes(word));
      report.push(mapText.includes("非用户流量") && mapText.includes("禁止读取 settings.llm_api_key") && !operatorAsTraffic.length ? "PASS operator key not user traffic" : "FAIL operator key traffic");
      report.push(coverage(mapText, ["LlmClient", "candidate_llm_api_key", "D-007-C", "D-008-B", "D-009-B"], "key algorithms"));
      report.push(coverage(mapText, ["T-011", "T-022"], "history"));
      const boundOk = (currentMap.runtime_verification_boundaries || []).some((item) => item.id === "AC-051" && String(item.status).includes("未验"));
      report.push(boundOk && mapText.includes("AC-052") && mapText.includes("AC-054") ? "PASS runtime bounds unlabeled as passed" : "FAIL runtime bounds");
      const claimedPassed = ["AC-051 已核对通过", "真实 SMTP 已核对通过", "真实百炼 401 已核对通过"].filter((word) => mapText.includes(word) || document.body.innerText.includes(word));
      report.push(claimedPassed.length ? "FAIL claimed runtime pass " + claimedPassed.join("/") : "PASS no false runtime pass");
      showPage("page-chat");
      document.querySelectorAll("#view-page details summary").forEach((el) => el.click());
      const firstApi = document.querySelector("a[href='#api-006']");
      report.push(firstApi ? "PASS api link" : "FAIL api link");
      showPage("page-apps");
      document.querySelectorAll("#view-page details summary").forEach((el) => el.click());
      const patchApi = document.querySelector("a[href='#api-010']");
      report.push(patchApi ? "PASS api-010 link" : "FAIL api-010 link");
      const host = document.createElement("div");
      host.id = "copy-fallback-test";
      document.body.appendChild(host);
      copyPath("backend/src/services/agent.py", host);
      const out = document.createElement("pre");
      out.id = "selftest-report";
      out.textContent = report.join("\n");
      document.body.appendChild(out);
    }

    function boot(map) {
      window.__applyFingerprintRefresh = applyFingerprintRefresh;
      mount(map);
      if (new URLSearchParams(location.search).get("selftest") === "1") {
        window.__selftest = true;
        runSelftest();
      }
    }

    const embedded = JSON.parse($("embedded-map").textContent || "{}");
    if (embedded && embedded.pages) {
      boot(embedded);
    } else {
      fetch("project-map.json")
        .then((res) => {
          if (!res.ok) throw new Error("地图文件不可读");
          return res.json();
        })
        .then(boot)
        .catch((err) => {
          document.querySelector("main").insertAdjacentHTML(
            "afterbegin",
            `<div class="card"><p>来源缺失：docs/project-map.json 未能载入（${escapeHtml(err.message)}）。可用「刷新与核对」手选文件。</p></div>`
          );
          showRefresh();
        });
    }
  </script>
</body>
</html>
